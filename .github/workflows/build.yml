name: Build OnePlus 9R Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache build-essential libssl-dev flex bison bc cpio zip unzip python3 libelf-dev libdw-dev

      - name: Clone toolchain
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang

      - name: Clone kernel source
        run: git clone --depth=1 -b bpf-5.15-backport https://github.com/toraidl/android_kernel_oneplus_sm8250.git $HOME/kernel

      - name: Integrate KernelSU
        run: |
          cd $HOME/kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure
        run: |
          cd $HOME/kernel
          make O=out ARCH=arm64 HOSTCC=/usr/bin/gcc vendor/kona-perf_defconfig
          ./scripts/config --file out/.config -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e KRETPROBES
          make O=out ARCH=arm64 HOSTCC=/usr/bin/gcc olddefconfig

      - name: Build kernel
        run: |
          cd $HOME/kernel
          C=$HOME/clang
          make -j$(nproc) O=out ARCH=arm64 CC=$C/bin/clang CROSS_COMPILE=$C/bin/aarch64-linux-gnu- HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/ak
          cd $HOME/ak
          K=$HOME/kernel/out/arch/arm64/boot
          if [ -f "$K/Image.gz" ]; then
            cp "$K/Image.gz" .
          else
            cp "$K/Image" .
            sed -i 's/^kernel.image=.*/kernel.image=Image/' anykernel.sh
          fi
          sed -i 's/^device.name1=.*/device.name1=lemonades/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=OnePlus9R/' anykernel.sh
          zip -r9 $HOME/SukiSU-lemonades.zip . -x .git/\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-lemonades-kernel
          path: /home/runner/SukiSU-lemonades.zip