name: Build OnePlus 9R Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # 一加 9R(lemonades) 原厂 4.19.325 内核
          kernel-url: https://github.com/toraidl/android_kernel_oneplus_sm8250
          kernel-branch: bpf-5.15-backport
          config: vendor/kona-perf_defconfig
          arch: arm64
          aosp-clang: true
          aosp-clang-version: r383902
          # 集成官方 KernelSU（root 方案）
          ksu: true
          # 打包成 AnyKernel3 可刷 zip
          anykernel3: true
